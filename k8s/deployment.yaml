apiVersion: apps/v1
kind: Deployment
metadata:
  name: photovault-api
  namespace: photovault
  labels:
    app: photovault-api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: photovault-api
  template:
    metadata:
      labels:
        app: photovault-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: photovault-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: photovault-api
        image: photovault/api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: hazelcast
          containerPort: 5701
          protocol: TCP
        env:
        # Database Configuration
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: photovault-config
              key: db.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: photovault-config
              key: db.port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: photovault-config
              key: db.name
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: photovault-secrets
              key: db.username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: photovault-secrets
              key: db.password

        # Kafka Configuration
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: photovault-config
              key: kafka.bootstrap.servers

        # JWT Security
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: photovault-secrets
              key: jwt.secret

        # Storage Configuration
        - name: STORAGE_TYPE
          valueFrom:
            configMapKeyRef:
              name: photovault-config
              key: storage.type
        - name: R2_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: photovault-secrets
              key: r2.endpoint
        - name: R2_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: photovault-secrets
              key: r2.access.key
        - name: R2_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: photovault-secrets
              key: r2.secret.key
        - name: R2_BUCKET
          valueFrom:
            configMapKeyRef:
              name: photovault-config
              key: r2.bucket
        - name: CDN_URL
          valueFrom:
            configMapKeyRef:
              name: photovault-config
              key: cdn.url

        # S3 Backup Configuration
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: photovault-secrets
              key: s3.access.key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: photovault-secrets
              key: s3.secret.key
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: photovault-config
              key: s3.bucket
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: photovault-config
              key: s3.region
        - name: BACKUP_ENABLED
          value: "true"
        - name: BACKUP_CRON
          value: "0 0 2 * * *"
        - name: BACKUP_RETENTION_DAYS
          value: "30"

        # Hazelcast Configuration
        - name: HAZELCAST_KUBERNETES_ENABLED
          value: "true"
        - name: HAZELCAST_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: HAZELCAST_KUBERNETES_SERVICE_NAME
          value: hazelcast-service

        # Spring Profile
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"

        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]

        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - photovault-api
              topologyKey: kubernetes.io/hostname
