apiVersion: v1
kind: Service
metadata:
  name: photovault-api-service
  namespace: photovault
  labels:
    app: photovault-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: photovault-api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: hazelcast-service
  namespace: photovault
  labels:
    app: photovault-api
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for Hazelcast discovery
  selector:
    app: photovault-api
  ports:
  - name: hazelcast
    port: 5701
    targetPort: 5701
    protocol: TCP
  publishNotReadyAddresses: true
