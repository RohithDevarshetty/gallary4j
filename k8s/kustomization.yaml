apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: photovault

resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  # - secret.yaml  # Create manually for security
  - deployment.yaml
  - service.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: photovault
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: photovault-platform

images:
  - name: photovault/api
    newTag: latest
