    <rect x="24" y="0"  width="24" height="10" rx="1.5" fill="url(#brick)"/>

    <rect x="0"  y="12" width="14" height="10" rx="1.5" fill="url(#brick)"/>
    <rect x="16" y="12" width="22" height="10" rx="1.5" fill="url(#brick)"/>
    <rect x="40" y="12" width="8"  height="10" rx="1.5" fill="url(#brick)"/>

    <rect x="0"  y="24" width="20" height="10" rx="1.5" fill="url(#brick)"/>
    <rect x="22" y="24" width="26" height="10" rx="1.5" fill="url(#brick)"/>

    <rect x="0"  y="0"  width="48" height="3" fill="url(#shine)"/>
